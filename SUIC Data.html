<script>
  // Header preview: lee estado guardado en localStorage (clave profile_editor_fb_v1)
  (function(){
    const LS_KEY = 'profile_editor_fb_v1'
    const hpAvatar = document.getElementById('hpAvatar')
    const hpName = document.getElementById('hpName')
    const headerPreview = document.getElementById('headerPreview')

    function applyState(state){
      if(!state) return
      // nombre
      if(hpName) hpName.textContent = state.name || 'Nombre Apellido'
      // avatar: imagen o iniciales
      if(hpAvatar){
        if(state.photo){
          hpAvatar.innerHTML = ''
          const img = document.createElement('img')
          img.src = state.photo
          hpAvatar.appendChild(img)
        }else{
          hpAvatar.innerHTML = ''
          hpAvatar.style.background = state.bg || '#2563eb'
          hpAvatar.style.color = state.initialsColor || '#ffffff'
          hpAvatar.textContent = (state.initials||'EA').toUpperCase()
        }
      }
    }

    function load(){
      try{
        const raw = localStorage.getItem(LS_KEY)
        if(!raw) return
        const state = JSON.parse(raw)
        applyState(state)
      }catch(e){ console.warn('Header preview: no se pudo leer estado', e) }
    }

    // inicializa
    document.addEventListener('DOMContentLoaded', load)
    // actualiza si se cambia localStorage desde otra pestaña
    window.addEventListener('storage', (e)=>{ if(e.key===LS_KEY) load() })

    // abrir editor al hacer click
    if(headerPreview){ headerPreview.addEventListener('click', ()=>{ window.location.href = 'profile_editor_fb.html' }) }
  })()
</script>

    <script>
      // Pin 'Asignado a' persistente: defer initialization until DOM is ready
      (function(){
        const KEY = 'suic_fixed_asignado'

        // --- IndexedDB helpers ---
        function openDB(){
          return new Promise((resolve, reject)=>{
            try{
              const req = indexedDB.open('suic_db', 1)
              req.onupgradeneeded = (e) => {
                const db = e.target.result
                if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv')
              }
              req.onsuccess = () => resolve(req.result)
              req.onerror = () => reject(req.error)
            }catch(err){ reject(err) }
          })
        }

        function idbSet(key, value){
          return new Promise(async (resolve)=>{
            try{
              const db = await openDB()
              const tx = db.transaction('kv', 'readwrite')
              const store = tx.objectStore('kv')
              store.put(value, key)
              tx.oncomplete = () => { db.close(); resolve(true) }
              tx.onerror = () => { db.close(); resolve(false) }
            }catch(e){ resolve(false) }
          })
        }

        function idbGet(key){
          return new Promise(async (resolve)=>{
            try{
              const db = await openDB()
              const tx = db.transaction('kv', 'readonly')
              const store = tx.objectStore('kv')
              const req = store.get(key)
              req.onsuccess = ()=>{ db.close(); resolve(req.result) }
              req.onerror = ()=>{ db.close(); resolve(null) }
            }catch(e){ resolve(null) }
          })
        }

        function idbRemove(key){
          return new Promise(async (resolve)=>{
            try{
              const db = await openDB()
              const tx = db.transaction('kv', 'readwrite')
              tx.objectStore('kv').delete(key)
              tx.oncomplete = () => { db.close(); resolve(true) }
              tx.onerror = () => { db.close(); resolve(false) }
            }catch(e){ resolve(false) }
          })
        }

        // --- Cookie helpers ---
        function setCookie(name, value, days){
          try{
            const maxage = (days||3650) * 24 * 60 * 60
            document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) + ';max-age=' + maxage + ';path=/;SameSite=Lax'
          }catch(e){}
        }
        function getCookie(name){
          try{
            const parts = document.cookie.split('; ').map(p=>p.split('='))
            for(const p of parts){ if(decodeURIComponent(p[0])===name) return decodeURIComponent(p[1]||'') }
          }catch(e){}
          return null
        }
        function removeCookie(name){
          try{ document.cookie = encodeURIComponent(name) + '=;max-age=0;path=/;SameSite=Lax' }catch(e){}
        }

        // Ask browser for persistent storage where supported
        async function requestPersistence(){
          try{
            if(navigator.storage && navigator.storage.persist){
              const granted = await navigator.storage.persist()
              console.log('Storage persistence granted:', granted)
            }
          }catch(e){ /* ignore */ }
        }

        // Read from many sources (priority: localStorage, cookie, indexedDB)
        async function readAny(){
          try{ const v = localStorage.getItem(KEY); if(v) return v }catch(e){}
          try{ const c = getCookie(KEY); if(c) return c }catch(e){}
          try{ const idv = await idbGet(KEY); if(idv) return idv }catch(e){}
          return null
        }

        // apply state to elements (elements passed in)
        function applyPinnedState(asignadoEl, pinBtn, isPinned, val){
          if(asignadoEl){
            asignadoEl.value = isPinned ? val : ''
            asignadoEl.readOnly = !!isPinned
            asignadoEl.style.opacity = isPinned ? '0.9' : '1'
            asignadoEl.style.pointerEvents = isPinned ? 'none' : 'auto'
          }
          if(pinBtn){
            pinBtn.style.background = isPinned ? 'linear-gradient(90deg,#0b1220,#1f2a44)' : 'rgba(255,255,255,0.8)'
            pinBtn.style.color = isPinned ? '#fff' : '#000'
            pinBtn.title = isPinned ? 'Desfijar asignado' : 'Fijar asignado'
          }
        }

        // init after DOM ready
        document.addEventListener('DOMContentLoaded', async ()=>{
          const pinBtn = document.getElementById('pinAsignado')
          const asignadoEl = document.getElementById('asignado')

          async function setPinned(val){
            try{ localStorage.setItem(KEY, val) }catch(e){}
            try{ setCookie(KEY, val, 3650) }catch(e){}
            try{ await idbSet(KEY, val) }catch(e){}
            await requestPersistence()
            applyPinnedState(asignadoEl, pinBtn, true, val)
          }

          async function unsetPinned(){
            try{ localStorage.removeItem(KEY) }catch(e){}
            try{ removeCookie(KEY) }catch(e){}
            try{ await idbRemove(KEY) }catch(e){}
            applyPinnedState(asignadoEl, pinBtn, false, '')
          }

          // Apply existing pinned value from any storage
          try{
            const v = await readAny()
            if(v) applyPinnedState(asignadoEl, pinBtn, true, v)
            else applyPinnedState(asignadoEl, pinBtn, false, '')
          }catch(e){ applyPinnedState(asignadoEl, pinBtn, false, '') }

          if(pinBtn){
            pinBtn.addEventListener('click', async ()=>{
              const cur = await readAny()
              if(cur){
                await unsetPinned()
                return
              }
              const value = asignadoEl && asignadoEl.value ? asignadoEl.value.trim() : ''
              if(!value){ alert('Escribe o selecciona un valor en "Asignado a" antes de fijar.'); return }
              await setPinned(value)
            })
          }

          // Watcher: si otro proceso borra el campo o el storage, restauramos el valor fijado cada segundo
          let restoreInterval = null
          try{
            restoreInterval = setInterval(async ()=>{
              const cur = await readAny()
              if(cur){
                // si el input no muestra el valor, reponer
                if(!asignadoEl) return
                if(asignadoEl.value !== cur || !asignadoEl.readOnly){
                  applyPinnedState(asignadoEl, pinBtn, true, cur)
                }
              }
            }, 1000)
          }catch(e){ /* ignore */ }

          // before unload: re-write storages to make accidental removal less likely
          window.addEventListener('beforeunload', async (ev)=>{
            try{
              const cur = await readAny()
              if(cur){
                try{ localStorage.setItem(KEY, cur) }catch(e){}
                try{ setCookie(KEY, cur, 3650) }catch(e){}
                try{ await idbSet(KEY, cur) }catch(e){}
              }
            }catch(e){ }
          })

          // cleanup if page is navigated away programmatically
          window.addEventListener('unload', ()=>{ if(restoreInterval) clearInterval(restoreInterval) })

        })

        // cross-tab sync (localStorage events)
        window.addEventListener('storage', (e)=>{
          if(e.key === KEY){
            document.addEventListener('DOMContentLoaded', ()=>{
              const pinBtn = document.getElementById('pinAsignado')
              const asignadoEl = document.getElementById('asignado')
              if(e.newValue) applyPinnedState(asignadoEl, pinBtn, true, e.newValue)
              else applyPinnedState(asignadoEl, pinBtn, false, '')
            })
          }
        })

      })()
    </script>

<!-- Descarga Todo (misma lógica que Registros.html) -->
<script>
  function descargarTodoCSV(){
    try{
      const raw = localStorage.getItem('registros');
      const registrosLocal = raw ? JSON.parse(raw) : [];
      if (!registrosLocal || registrosLocal.length === 0) { alert('No hay formularios guardados.'); return; }

      const encabezados = [
        'Inicio', 'Estado de Inicio', 'Final', 'Estado Final', 'Nombre', 'Acciones',
        'Detalle de Solicitud', 'Fallas', 'Descripción', 'Comentarios', 'Tiempo de Gestión',
        'Nuevo o Actualizado', 'Cant Documentos', 'Categoría', 'Analista/Área',
        'Nombre de Documento', 'Asignado a', 'Prioridad', 'Tiempo (cronómetro)', 'Cant Escuelas', 'Cant Candidatos', 'Tipos de Canales'
      ];

      let contenido = encabezados.join(',') + '\n';

      function calcularCronoDesdeFila(fila){
        try{
          const last = fila[fila.length - 1];
          if(last && typeof last === 'string' && /^\d{1,2}:\d{2}:\d{2}$/.test(String(last).trim())) return String(last).trim();
          const parse = (s) => {
            if (!s || typeof s !== 'string') return null;
            const parts = s.split(' ');
            if (parts.length < 2) return null;
            const time = parts[0].split(':').map(Number);
            const date = parts[1].split('/').map(Number);
            if (time.length < 3 || date.length < 3) return null;
            return new Date(date[2], date[1]-1, date[0], time[0], time[1], time[2]);
          };
          const a = parse(fila[0]);
          const b = parse(fila[2]);
          if(a && b){
            const diff = Math.abs(b - a);
            const totalSeconds = Math.floor(diff / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            const pad = (n) => String(n).padStart(2, '0');
            return `${pad(hours)}:${pad(mins)}:${pad(secs)}`;
          }
        }catch(e){}
        return '';
      }

      registrosLocal.forEach(filaOrig => {
        const fila = Array.isArray(filaOrig) ? filaOrig.slice() : [];
        const needed = encabezados.length;
        const timeIndex = encabezados.indexOf('Tiempo (cronómetro)');

        // Calcular/asegurar cronómetro en la columna correspondiente
        try {
          if (fila.length <= timeIndex) {
            while(fila.length <= timeIndex) fila.push('');
            fila[timeIndex] = calcularCronoDesdeFila(fila);
          } else {
            const cur = fila[timeIndex];
            if(!(typeof cur === 'string' && /^\d{1,2}:\d{2}:\d{2}$/.test(String(cur).trim()))) {
              fila[timeIndex] = calcularCronoDesdeFila(fila);
            }
          }
        } catch(e) { /* ignore */ }

        // Rellenar vacíos hasta el tamaño requerido
        if (fila.length < needed) {
          while(fila.length < needed) fila.push('');
        } else if (fila.length > needed) {
          fila.length = needed;
        }

        const escaped = fila.map(valor => '"' + String(valor || '').replace(/"/g, '""') + '"').join(',');
        contenido += escaped + '\n';
      });

      const blob = new Blob([contenido], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'SUIC Data.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }catch(err){ console.error(err); alert('Ocurrió un error al generar la descarga: ' + (err && err.message ? err.message : String(err))); }
  }
</script>

<script>
  (function(){
    const AUTOSAVE_KEY = 'autosave_enabled';

    function isAutoSaveEnabled(){
      try { return localStorage.getItem(AUTOSAVE_KEY) === '1'; } catch (e) { return false; }
    }

    function setAutoSaveEnabled(value){
      try { localStorage.setItem(AUTOSAVE_KEY, value ? '1' : '0'); } catch (e) { }
    }

    function updateAutoSaveButton(){
      const btn = document.getElementById('toggle-autodelete');
      const ico = document.getElementById('autodel-icon');
      if (!btn) return;
      const enabled = isAutoSaveEnabled();
      btn.classList.toggle('active', enabled);
      btn.title = enabled ? 'Autoguardado: activado' : 'Autoguardado: desactivado';
      if (ico) ico.textContent = enabled ? '🧾' : '🚫';
    }

    function toggleAutoSave(){
      const enabled = !isAutoSaveEnabled();
      setAutoSaveEnabled(enabled);
      updateAutoSaveButton();
      if (typeof window.DraftSystem !== 'undefined') {
        if (enabled && typeof window.DraftSystem.startAutoSave === 'function') {
          window.DraftSystem.startAutoSave();
          if (typeof window.DraftSystem.restore === 'function') {
            window.DraftSystem.restore();
          }
        } else if (!enabled && typeof window.DraftSystem.stopAutoSave === 'function') {
          window.DraftSystem.stopAutoSave();
        }
      }
    }

    function initAutoSaveButton(){
      updateAutoSaveButton();
      const btn = document.getElementById('toggle-autodelete');
      if (!btn) return;
      btn.addEventListener('click', toggleAutoSave);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAutoSaveButton, { once: true });
    } else {
      initAutoSaveButton();
    }
  })();
</script>

<!-- Proteger selectores de tiempo: ejecutar después de que todos los scripts se carguen -->
<script>
  document.addEventListener('DOMContentLoaded', function(){
    // Garantizar que los selectores "inicio" y "final" siempre muestren sus opciones del HTML
    function ensureSelectorsIntact(){
      // Selector "inicio" debe tener: "Selecciona..." y "En proceso"
      const selInicio = document.getElementById('inicio');
      const selFinal = document.getElementById('final');
      
      // Si inicio está vacío, reconstruir
      if(selInicio && selInicio.options.length === 0){
        const opt1 = document.createElement('option');
        opt1.value = '';
        opt1.textContent = 'Selecciona…';
        selInicio.appendChild(opt1);
        
        const opt2 = document.createElement('option');
        opt2.value = 'En proceso';
        opt2.textContent = 'En proceso';
        selInicio.appendChild(opt2);
      }
      
      // Si final está vacío, reconstruir
      if(selFinal && selFinal.options.length === 0){
        const options = [
          { value: '', text: 'Selecciona…' },
          { value: 'Continuar', text: 'Continuar' },
          { value: 'En pausa', text: 'En pausa' },
          { value: 'Reasignado', text: 'Reasignado' },
          { value: 'Finalizado', text: 'Finalizado' }
        ];
        options.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt.value;
          option.textContent = opt.text;
          selFinal.appendChild(option);
        });
      }
    }
    
    // Garantizar integridad de selectores después de pequeño delay (asegurar que todos los scripts acabaron)
    setTimeout(ensureSelectorsIntact, 100);
  }, false);
</script>

<!-- Auto-llenado unificado de Boletín y Pop Up con funcionalidad de calendario + copiar -->
<script>
window.setupCategoryActions = function() {
  const categoria = document.getElementById('categoria');
  const nombre = document.getElementById('nombre');
  const inputFecha = document.getElementById('nombre-fecha');
  const btnFecha = document.getElementById('btn-fecha-nombre');
  const documento = document.getElementById('documento');
  const btnCopiar = document.getElementById('btn-copiar-documento');
  const popupsDatalist = document.getElementById('popups');
  const nombreBannerSugerido = 'Banner Boletín XXXXXXXX';

  // Ocultar el input de fecha
  if (inputFecha) {
    inputFecha.style.position = 'absolute';
    inputFecha.style.left = '-9999px';
    inputFecha.style.top = '-9999px';
    inputFecha.style.display = 'none';
  }

  if (!categoria || !nombre || !inputFecha || !btnFecha || !documento || !btnCopiar || !popupsDatalist) {
    console.error('[CategoryActions] Elementos no encontrados');
    return;
  }

  console.log('[CategoryActions] Setup iniciado');

  function obtenerFechaFormato(dateStr) {
    const parts = dateStr.split('-');
    if (parts.length !== 3) return '';
    const [y, m, d] = parts;
    return `${d}${m}${y}`;
  }

  function textoAFecha(texto) {
    const match = texto.match(/(\d{2})(\d{2})(\d{4})/);
    if (!match) {
      const hoy = new Date();
      const d = String(hoy.getDate()).padStart(2, '0');
      const m = String(hoy.getMonth() + 1).padStart(2, '0');
      const y = hoy.getFullYear();
      return `${y}-${m}-${d}`;
    }
    const [, d, m, y] = match;
    return `${y}-${m}-${d}`;
  }

  function generarOpcionesPopUp(fechaDDMMAAAA) {
    const horarios = [
      { hora: '10:00', periodo: 'a.m.' },
      { hora: '12:00', periodo: 'p.m.' },
      { hora: '03:00', periodo: 'p.m.' },
      { hora: '05:00', periodo: 'p.m.' },
      { hora: '07:00', periodo: 'p.m.' }
    ];
    return horarios.map(h => `Pop Ups ${fechaDDMMAAAA} - ${h.hora} ${h.periodo}`);
  }

  function actualizarOpcionesPopUp() {
    const nombreValor = nombre.value.trim();
    const match = nombreValor.match(/Pop Ups\s+(\d{8})/i);
    let fechaDDMMAAAA = '';

    if (match) {
      fechaDDMMAAAA = match[1];
    } else {
      const hoy = new Date();
      const d = String(hoy.getDate()).padStart(2, '0');
      const m = String(hoy.getMonth() + 1).padStart(2, '0');
      const y = hoy.getFullYear();
      fechaDDMMAAAA = `${d}${m}${y}`;
    }

    if (!popupsDatalist) return;
    popupsDatalist.innerHTML = '';
    const opciones = generarOpcionesPopUp(fechaDDMMAAAA);
    opciones.forEach(opcion => {
      const opt = document.createElement('option');
      opt.value = opcion;
      popupsDatalist.appendChild(opt);
    });
  }

  function actualizarOpcionesBanner() {
    popupsDatalist.innerHTML = '';
    if (nombre.value.trim()) return;
    const opt = document.createElement('option');
    opt.value = nombreBannerSugerido;
    popupsDatalist.appendChild(opt);
  }

  function actualizarVisibilidad() {
    const cat = (categoria.value || '').trim().toLowerCase();
    const esBoletin = cat === 'boletín';
    const esPopUp = cat === 'pop up';
    const esBanner = cat === 'banner';
    
    // El calendario depende de la categoría; copiar Nombre está disponible siempre.
    btnFecha.style.display = (esBoletin || esPopUp) ? 'flex' : 'none';
    btnCopiar.style.display = 'flex';

    if (esBoletin) {
      // Lógica para Boletín: auto-rellenar solo si está vacío
      if (!nombre.value || !nombre.value.startsWith('Boletín')) {
        const hoy = new Date();
        const d = String(hoy.getDate()).padStart(2, '0');
        const m = String(hoy.getMonth() + 1).padStart(2, '0');
        const y = hoy.getFullYear();
        nombre.value = `Boletín ${d}${m}${y}`;
        inputFecha.value = `${y}-${m}-${d}`;
      }
      console.log('[CategoryActions] Inicializado para Boletín');
    } else if (esPopUp) {
      // Lógica para Pop Up: NO limpiar si ya tiene un valor válido
      // Solo limpiar si está vacío O si no tiene el formato correcto de Pop Up
      const esPopUpValido = nombre.value && nombre.value.match(/Pop Ups \d{8} - \d{2}:\d{2} (a\.m\.|p\.m\.)/);
      
      if (!esPopUpValido) {
        // NO rellenar el nombre, solo preparar opciones
        // nombre.value = ''; // <-- ELIMINADO para NO borrar el contenido existente
        inputFecha.value = '';
        actualizarOpcionesPopUp();
        console.log('[CategoryActions] Inicializado para Pop Up - opciones disponibles');
      } else {
        actualizarOpcionesPopUp();
        console.log('[CategoryActions] Pop Up válido detectado, opciones actualizadas');
      }
    } else if (esBanner) {
      actualizarOpcionesBanner();
    } else {
      // Limpiar datalist cuando no es Pop Up
      popupsDatalist.innerHTML = '';
    }
  }

  // Listener para cambio de categoría
  categoria.addEventListener('input', actualizarVisibilidad);
  categoria.addEventListener('change', actualizarVisibilidad);
  nombre.addEventListener('input', function() {
    const cat = (categoria.value || '').trim().toLowerCase();
    if (cat === 'pop up') {
      actualizarOpcionesPopUp();
    } else if (cat === 'banner') {
      actualizarOpcionesBanner();
    }
  });

  // Hover minimalista solo cuando están visibles
  btnFecha.addEventListener('mouseenter', function() {
    if (window.getComputedStyle(btnFecha).display !== 'none') {
      this.style.background = 'rgba(0,0,0,0.08)';
      this.style.borderColor = '#bbb';
    }
  });
  btnFecha.addEventListener('mouseleave', function() {
    if (window.getComputedStyle(btnFecha).display !== 'none') {
      this.style.background = 'rgba(0,0,0,0.03)';
      this.style.borderColor = '#ddd';
    }
  });

  // Listener para click en botón calendario
  btnFecha.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    
    const cat = (categoria.value || '').trim().toLowerCase();
    let fechaYYYYMMDD = '';
    
    if (cat === 'pop up') {
      // Para Pop Up: usar fecha actual o extraer del nombre
      if (nombre.value && nombre.value.match(/\d{8}/)) {
        fechaYYYYMMDD = textoAFecha(nombre.value);
      } else {
        const hoy = new Date();
        const d = String(hoy.getDate()).padStart(2, '0');
        const m = String(hoy.getMonth() + 1).padStart(2, '0');
        const y = hoy.getFullYear();
        fechaYYYYMMDD = `${y}-${m}-${d}`;
      }
    } else if (cat === 'boletín') {
      // Para Boletín: usar fecha actual o extraer del nombre
      fechaYYYYMMDD = textoAFecha(nombre.value);
    }
    
    inputFecha.value = fechaYYYYMMDD;
    console.log('[CategoryActions] Click calendario - abriendo picker con fecha:', fechaYYYYMMDD);
    
    inputFecha.style.display = 'block';
    inputFecha.style.position = 'static';
    inputFecha.style.left = 'auto';
    inputFecha.style.top = 'auto';
    inputFecha.focus();
    
    if (inputFecha.showPicker && typeof inputFecha.showPicker === 'function') {
      try {
        inputFecha.showPicker();
      } catch (err) {
        console.error('[CategoryActions] showPicker error:', err);
      }
    } else {
      inputFecha.click();
    }
  });

  // Listener para when date input loses focus
  inputFecha.addEventListener('blur', function() {
    console.log('[CategoryActions] Input fecha blur');
    inputFecha.style.display = 'none';
    inputFecha.style.position = 'absolute';
    inputFecha.style.left = '-9999px';
    inputFecha.style.top = '-9999px';
  });

  // Listener para cambio de fecha
  inputFecha.addEventListener('change', function() {
    if (this.value) {
      const cat = (categoria.value || '').trim().toLowerCase();
      const fechaFormato = obtenerFechaFormato(this.value);
      
      if (cat === 'boletín') {
        nombre.value = `Boletín ${fechaFormato}`;
        console.log('[CategoryActions] Fecha actualizada para Boletín:', nombre.value);
      } else if (cat === 'pop up') {
        // Para Pop Up: actualizar las opciones del datalist con la nueva fecha
        // Y rellenar el campo "Nombre" con la primera opción (10:00 a.m.)
        popupsDatalist.innerHTML = '';
        const opciones = generarOpcionesPopUp(fechaFormato);
        opciones.forEach(opcion => {
          const opt = document.createElement('option');
          opt.value = opcion;
          popupsDatalist.appendChild(opt);
        });
        // Rellenar el campo "Nombre" con la primera opción
        nombre.value = opciones[0];
        console.log('[CategoryActions] Opciones de Pop Up actualizadas con fecha:', fechaFormato);
        console.log('[CategoryActions] Campo Nombre rellenado con:', opciones[0]);
      }
    }
  });

  // Listener para botón copiar
  btnCopiar.addEventListener('click', function(e) {
    e.preventDefault();
    if (!nombre || !nombre.value) {
      alert('El campo "Nombre" está vacío');
      return;
    }
    documento.value = nombre.value;
    console.log('[CategoryActions] Copiado "' + nombre.value + '" a Nombre de Documento');
    btnCopiar.classList.add('is-copied');
    setTimeout(() => {
      btnCopiar.classList.remove('is-copied');
    }, 1500);
  });

  // Listener para mostrar TODAS las opciones del datalist cuando es Pop Up
  nombre.addEventListener('focus', function(e) {
    const cat = (categoria.value || '').trim().toLowerCase();
    if (cat === 'pop up') {
      // Limpiar temporalmente para que se muestren todas las opciones
      const valorOriginal = this.value;
      this.value = '';
      
      // Simular click para abrir el datalist con todas las opciones
      setTimeout(() => {
        this.click();
      }, 50);
      
      // Restaurar el valor original después de un pequeño delay
      setTimeout(() => {
        if (!this.value) {
          this.value = valorOriginal;
        }
      }, 100);
    }
  });

  // Listener para click en el campo Nombre - también mostrar todas las opciones
  nombre.addEventListener('click', function(e) {
    const cat = (categoria.value || '').trim().toLowerCase();
    if (cat === 'pop up' && this.value) {
      // Si ya hay un valor, limpiar temporalmente para mostrar todas las opciones
      const valorOriginal = this.value;
      this.value = '';
      
      // Forzar click para abrir datalist
      setTimeout(() => {
        this.click();
      }, 50);
      
      // Restaurar valor si el usuario no selecciona nada
      setTimeout(() => {
        if (!this.value) {
          this.value = valorOriginal;
        }
      }, 100);
    }
  });

  // Inicializar estado
  actualizarVisibilidad();
  console.log('[CategoryActions] Setup completado');
};

// Ejecutar cuando DOM está listo
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', window.setupCategoryActions);
} else {
  window.setupCategoryActions();
}
</script>

// Ejecutar cuando DOM está listo
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', window.setupAutoLlenadoUsuarios);
} else {
  window.setupAutoLlenadoUsuarios();
}
</script>

<!-- Replicar en SUIC Data la función de descarga tal como está en Registros.html -->
<script>
  // Copiado desde Registros.html: descarga todo incluyendo la columna 'Actualizado' y 'Tiempo (cronómetro)'
  function descargarTodoCSV(){
    try{
      const raw = localStorage.getItem('registros');
      const registrosLocal = raw ? JSON.parse(raw) : [];
      if (!registrosLocal || registrosLocal.length === 0) { alert('No hay formularios guardados.'); return; }

      const encabezados = [
        'Inicio', 'Estado de Inicio', 'Final', 'Estado Final', 'Nombre', 'Acciones',
        'Detalle de Solicitud', 'Fallas', 'Descripción', 'Comentarios', 'Tiempo de Gestión',
        'Nuevo o Actualizado', 'Cant Documentos', 'Categoría', 'Analista/Área',
        'Nombre de Documento', 'Asignado a', 'Prioridad', 'Actualizado', 'Tiempo (cronómetro)', 'Cant Escuelas', 'Cant Candidatos', 'Tipos de Canales'
      ];

      let contenido = encabezados.join(',') + '\n';

      function calcularCronoDesdeFila(fila){
        try{
          const last = fila[fila.length - 1];
          if(last && typeof last === 'string' && /^\d{1,2}:\d{2}:\d{2}$/.test(String(last).trim())) return String(last).trim();
          const parse = (s) => {
            if (!s || typeof s !== 'string') return null;
            const parts = s.split(' ');
            if (parts.length < 2) return null;
            const time = parts[0].split(':').map(Number);
            const date = parts[1].split('/').map(Number);
            if (time.length < 3 || date.length < 3) return null;
            return new Date(date[2], date[1]-1, date[0], time[0], time[1], time[2]);
          };
          const a = parse(fila[0]);
          const b = parse(fila[2]);
          if(a && b){
            const diff = Math.abs(b - a);
            const totalSeconds = Math.floor(diff / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            const pad = (n) => String(n).padStart(2, '0');
            return `${pad(hours)}:${pad(mins)}:${pad(secs)}`;
          }
        }catch(e){ }
        return '';
      }

      registrosLocal.forEach(filaOrig => {
        const fila = Array.isArray(filaOrig) ? filaOrig.slice() : [];
        const needed = encabezados.length; // including 'Actualizado' and cronómetro
        const timeIndex = encabezados.indexOf('Tiempo (cronómetro)');

        try{
          if (fila.length <= timeIndex) {
            while(fila.length <= timeIndex) fila.push('');
            fila[timeIndex] = calcularCronoDesdeFila(fila);
          } else {
            const cur = fila[timeIndex];
            if(!(typeof cur === 'string' && /^\d{1,2}:\d{2}:\d{2}$/.test(String(cur).trim()))) {
              fila[timeIndex] = calcularCronoDesdeFila(fila);
            }
          }
        }catch(e){ }

        if (fila.length < needed) {
          while(fila.length < needed) fila.push('');
        } else if (fila.length > needed) {
          fila.length = needed;
        }
        const escaped = fila.map(valor => '"' + String(valor || '').replace(/"/g, '""') + '"').join(',');
        contenido += escaped + '\n';
      });

      const blob = new Blob([contenido], { type: 'text/csv;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'SUIC Data.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }catch(err){ console.error(err); alert('Ocurrió un error al generar la descarga: ' + (err && err.message ? err.message : String(err))); }
  }
</script>
